[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shortvideo-agent"
version = "0.1.0"
description = "短视频脚本 Agent：有事实依据、满足时长限制、可编辑"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.19",
    "pydantic==2.9.2",
    "httpx==0.27.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
shortvideo-agent = "shortvideo_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
